version: 2

models:
  - name: int_customers
    description: >
      Joins customers to their orders and keeps only the most recent order and
      location per customer, discarding customers with no orders. Combines data
      from staging_customers and staging_orders.
    columns:
      - name: customer_unique_id
        data_type: char(32)
        description: Persistent unique identifier for a customer across multiple orders.
        data_tests:
          - not_null
      - name: customer_city
        data_type: varchar(100)
        description: Customer city.
      - name: customer_state
        data_type: char(2)
        description: Two-letter Brazilian state abbreviation for the customer location.
      - name: latest_order_timestamp
        data_type: timestamp
        description: The latest order timestamp for each customer.

  - name: int_orders
    description: >
      Combines order data with payment and product details, and calculates
      delivery performance metrics such as days to deliver, estimation
      accuracy, and delivery delay classification. Combines data from
      staging_orders, staging_order_payments, and staging_order_items.
    columns:
      - name: order_id
        data_type: char(32)
        description: Unique identifier for each order.
        data_tests:
          - not_null
          - unique
      - name: customer_order_id
        data_type: char(32)
        description: Customer identifier associated with the order.
        data_tests:
          - not_null
      - name: products_purchased
        data_type: varchar
        description: All product ids purchased as part of the order, separated by a comma.
      - name: number_products_purchased
        data_type: integer
        description: The number of productds purchased as part of the order.
      - name: order_status
        data_type: varchar(30)
        description: Current status of the order.
      - name: order_purchase_date
        data_type: date
        description: Date when the order was placed, derived from the purchase timestamp.
      - name: order_puchase_month
        data_type: integer
        description: Month extracted from the order purchase date.
      - name: order_puchase_year
        data_type: integer
        description: Year extracted from the order purchase date.
      - name: order_delivered_carrier_date
        data_type: date
        description: Date when the order was handed to the carrier for delivery.
      - name: order_delivered_customer_date
        data_type: date
        description: Date when the order was delivered to the customer.
      - name: order_estimated_delivery_date
        data_type: date
        description: Estimated delivery date for the order..
      - name: payment_type
        data_type: varchar
        description: Type of payment used for the order.
      - name: payment_installments
        data_type: integer
        description: Number of installments for the payment.
      - name: payment_value
        data_type: numeric
        description: Value of the payment.
      - name: is_order_paid
        data_type: boolean
        description: Flag indicating whether the order has an associated payment record.
      - name: is_order_paid_in_full
        data_type: boolean
        description: Flag indicating whether the order was paid in full.
      - name: days_to_deliver_customer
        data_type: integer
        description: Number of days between the order purchase date and the customer delivery date.
      - name: estimated_days_to_deliver_customer
        data_type: integer
        description: Number of days between the customer delivery date and the estimated delivery date.
      - name: estimation_delivery_days_diff
        data_type: integer
        description: Difference between estimated and actual delivery days.
      - name: is_delivery_late
        data_type: boolean
        description: Flag indicating whether the order delivery was late relative to the estimated delivery date.
      - name: delivery_delay_type
        data_type: varchar
        description: >
          Classification of the delivery delay severity: Minor (<=3 days late),
          Moderate (<=7 days late), Severe (>7 days late), or On-time.

  - name: int_products_ordered
    description: >
      Filters the product catalog down to only products that have at least one
      associated order item, and enriches them with their English category
      translation. Combines data from staging_products, staging_order_items,
      and product_category_translation.
    columns:
      - name: product_id
        data_type: char(32)
        description: Unique identifier for each product.
        data_tests:
          - not_null
          - unique
      - name: product_category_name_pt
        data_type: varchar
        description: Product category name in Portuguese.
      - name: product_category_name_en
        data_type: varchar
        description: English translation of the product category name.
      - name: product_name_length
        data_type: integer
        description: Length of the product name.
      - name: product_description_length
        data_type: integer
        description: Length of the product description.
      - name: product_photos_qty
        data_type: integer
        description: Number of photos available for the product.
      - name: product_weight_g
        data_type: numeric
        description: Weight of the product in grams.
      - name: product_length_cm
        data_type: numeric
        description: Length of the product in centimeters.
      - name: product_height_cm
        data_type: numeric
        description: Height of the product in centimeters.
      - name: product_width_cm
        data_type: numeric
        description: Width of the product in centimeters.
